[versions]
asm = "9.11.1"
errorprone = "2.27.0"
jackson = "2.23.0"
junit = "5.14.4"
launchwrapper = "1.12"
lwjgl2 = "2.9.4-nightly-20150209"
lwjgl3 = "3.3.3"
modlauncher = "2.1.5"
modlauncher11 = "11.0.5"
sponge-mixin = "0.17.5+mixin.0.8.7"

