name: Provider bundle

on:
  pull_request:
    paths:
      - .github/workflows/provider-bundle.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - manifests/opengl-provider.json
      - native/gl-provider/**
      - tools/provider-bundle/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/provider-bundle.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - manifests/opengl-provider.json
      - native/gl-provider/**
      - tools/provider-bundle/**

permissions:
  contents: read

concurrency:
  group: provider-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool:
    name: Bundle tool
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/provider-bundle
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned checkers
        run: |
          python3 -m venv "$RUNNER_TEMP/checkers"
          "$RUNNER_TEMP/checkers/bin/pip" install --require-hashes --requirement requirements-dev.txt
          echo "$RUNNER_TEMP/checkers/bin" >> "$GITHUB_PATH"

      - name: Check the format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Check the types
        run: mypy

      - name: Test
        run: pytest

  bundle:
    name: Pinned bundle for ${{ matrix.platform }}
    needs: tool
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-x86_64
          - windows-x86_64
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image of the pinned toolchain
        run: >
          docker build
          --file tools/provider-bundle/container/Containerfile
          --tag provider-toolchain
          tools/provider-bundle/container

      - name: Build the bundle from the pinned sources
        run: |
          mkdir -p "$RUNNER_TEMP/bundles"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$RUNNER_TEMP/bundles:/out" \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONPATH=/work/tools/provider-bundle/src \
            provider-toolchain \
            python3 -m provider_bundle build --platform "$PLATFORM" --bundle "/out/$PLATFORM"

      - name: Compare the bundle with the digests the manifest pins
        env:
          PYTHONPATH: tools/provider-bundle/src
        run: python3 -m provider_bundle verify --platform "$PLATFORM" --bundle "$RUNNER_TEMP/bundles/$PLATFORM"

      - name: Install the lavapipe driver that Zink draws on
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvulkan1 mesa-vulkan-drivers ninja-build

      - name: Open contexts on the bundle through the provider
        if: matrix.platform == 'linux-x86_64'
        env:
          LIBGL_ALWAYS_SOFTWARE: "true"
        run: |
          cmake --preset linux-provider -DMINEMOD_PROVIDER_BUNDLE="$RUNNER_TEMP/bundles/$PLATFORM"
          cmake --build --preset linux-provider
          ctest --preset linux-provider

      - name: Keep the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opengl-provider-${{ matrix.platform }}
          path: ${{ runner.temp }}/bundles/${{ matrix.platform }}
          if-no-files-found: error
