name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset:
          - linux-debug
          - linux-release
    env:
      PRESET: ${{ matrix.preset }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Vulkan toolchain and the lavapipe driver
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            glslang-tools libvulkan-dev mesa-vulkan-drivers ninja-build vulkan-validationlayers

      - name: Configure
        run: cmake --preset "$PRESET"

      - name: Build
        run: cmake --build --preset "$PRESET"

      - name: Test
        run: ctest --preset "$PRESET"

  jvm:
    name: JVM on Java 8, 16, 17 and 21
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Java runtimes
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ninja-build

      - name: Check
        run: >
          sh ./gradlew check
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_16_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Verify the target matrix
        run: sh ./gradlew :tools:verification:run --args="check --profile foundation"

      - name: Verify the compatibility layer
        run: sh ./gradlew :tools:verification:run --args="check --profile compatibility"

      - name: Verify the adapters of every release
        run: |
          sh ./gradlew :tools:verification:run --args="check --profile adapters"
          sh ./gradlew :tools:verification:run --args="build-matrix --manifest manifests/minecraft-targets.json"

      - name: Verify the mod ecosystems
        run: sh ./gradlew :tools:verification:run --args="check --profile ecosystem"

  production-clients:
    name: Pinned calls on the production clients
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Java runtime
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore the clients and the name files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/verification-cache
          key: verification-cache-${{ hashFiles('manifests/minecraft-targets.json', 'adapters/**/release-plan.properties') }}

      - name: Apply every plan to the client of its release
        run: sh ./gradlew :tools:verification:run --args="scenario production-transformers"

      - name: Apply the plan of every loader to the client under its names
        run: |
          sh ./gradlew :tools:verification:run --args="scenario vanilla-matrix --report docs/compatibility/reports/vanilla-matrix.txt"
          git diff --exit-code -- docs/compatibility/reports/vanilla-matrix.txt

      - name: Start the clients without a loader through their agent
        run: |
          sh ./gradlew :adapters:bootstrap:mc-1.13:launcherInstall :adapters:bootstrap:mc-1.13.1:launcherInstall
          sh ./gradlew :tools:verification:run --args="scenario client-bootstrap --report docs/compatibility/reports/client-bootstrap.txt"
          git diff --exit-code -- docs/compatibility/reports/client-bootstrap.txt

  provider:
    name: Compatibility layer on Mesa/Zink
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SYSTEM_PROVIDER: /usr/lib/x86_64-linux-gnu
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Java runtimes
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: |
            8
            16
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Mesa with Zink, the lavapipe driver, the Vulkan toolchain and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            glslang-tools libegl1 libegl-mesa0 libgl1-mesa-dri libvulkan-dev libx11-dev libxcursor1 libxext6 \
            libxi6 libxinerama1 libxrandr2 libxrender1 libxtst6 mesa-vulkan-drivers ninja-build \
            vulkan-validationlayers xauth xvfb

      - name: Build the renderer and the stand-in that share their attachments
        run: |
          cmake --preset linux-client
          cmake --build --preset linux-client
          cmake --build --preset linux-scene-host

      - name: Test the layer against the installed Mesa
        run: >
          sh ./gradlew
          :compatibility:runtime:check
          :compatibility:lwjgl2:check
          :compatibility:lwjgl3:check
          :jvm:client-runtime:check
          -Pminemod.systemProvider="$SYSTEM_PROVIDER"
          -Pminemod.sceneHost="$GITHUB_WORKSPACE/build/linux-client/jni/libminemod_scene_host_jni.so"
          -Pminemod.sceneLibrary="$GITHUB_WORKSPACE/build/linux-client/jni/libminemod_jni.so"
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_16_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Compare the layer with the installed Mesa on generated scripts
        run: >
          sh ./gradlew
          :tools:verification:test --tests '*.differential.provider.*'
          :tools:verification:run
          --args="compare --suite gl-differential --provider $SYSTEM_PROVIDER
          --natives build/linux-client/jni/libminemod_gl_provider_jni.so"
          -Pminemod.systemProvider="$SYSTEM_PROVIDER"
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_16_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: Present on the windows of a virtual display through the native owners
        run: >
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24"
          sh ./gradlew
          :adapters:presentation:glfw:check
          :adapters:presentation:display:check
          -Pminemod.sceneLibrary="$GITHUB_WORKSPACE/build/linux-client/jni/libminemod_jni.so"
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_16_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

  provider-windows:
    name: OpenGL provider on Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Annotate the diagnostics of CMake, of MSVC and of the tests
        run: |
          echo "::add-matcher::.github/problem-matchers/cmake.json"
          echo "::add-matcher::.github/problem-matchers/msvc.json"

      - name: Configure
        run: cmake --preset windows-provider

      - name: Build
        run: cmake --build --preset windows-provider

      - name: Test
        run: ctest --preset windows-provider
